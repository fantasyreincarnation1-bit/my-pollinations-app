<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollinations App Integration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            background-color: #334155;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pollinations App</h1>
        <p>Your application is active and ready for authentication requests.</p>
        <div class="status">Status: Online & Ready</div>
    </div>
</body>
  </html>
