<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .spinner {
            border: 4px solid #334155;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Connecting to Pollinations</h2>
        <div class="spinner"></div>
        <p>Completing authentication process...</p>
    </div>

    <script>
        // Redirect or close after processing auth token if present in URL
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('key') || urlParams.get('token');
            
            if (token) {
                console.log('Authentication successful');
            }
            
            // Auto close or redirect if opened as popup
            setTimeout(() => {
                if (window.opener) {
                    window.close();
                }
            }, 2000);
        };
    </script>
</body>
</html>
